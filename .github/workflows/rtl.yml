name: RTL quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore locked toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .cache/common/downloads
            .cache/common/toolchains
          key: toolchains-${{ runner.os }}-${{ hashFiles('config/toolchains.lock.json') }}
      - name: Set up locked EDA tools
        uses: ./.github/actions/locked-tools
        with:
          tools: verilator verible iverilog yosys sby bitwuzla
      - name: Install Makefile formatter
        run: |
          python3 -m pip install --user mbake==1.4.6
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Tool inventory
        run: make doctor
      - name: License headers
        run: make license-check
      - name: Format
        run: make format-check
      - name: Lint
        run: make lint
      - name: Icarus regression
        run: make test-iverilog
      - name: Verilator regression
        run: make test-verilator
      - name: Synthesis checks
        run: make synth
      - name: Formal checks
        run: make formal
